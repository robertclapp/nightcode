name: CI

on:
  push:
    branches: [main]
  pull_request:

# Prisma resolves DATABASE_URL at config load (even for `generate`), so provide
# a dummy value. No database is contacted — this only generates the client.
env:
  DATABASE_URL: postgresql://user:pass@localhost:5432/nightcode

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run --cwd packages/database db:generate

      - name: Typecheck shared package
        run: bunx tsc --noEmit -p packages/shared/tsconfig.json

      - name: Run tests
        run: bun test packages/
